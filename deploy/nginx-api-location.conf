# Reverse-proxy the API to the Python service on localhost.
#
# Add this block INSIDE the `server { ... }` for evan.leckliter.net in
# /etc/nginx/sites-available/evan.leckliter.net (the HTTPS server block that
# certbot manages). No trailing path on proxy_pass, so the full /api/... URI
# is forwarded to the backend unchanged.
#
#   location /api/ {
#       proxy_pass http://127.0.0.1:8787;
#       proxy_http_version 1.1;
#       proxy_set_header Host              $host;
#       proxy_set_header X-Real-IP         $remote_addr;
#       proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
#       proxy_set_header X-Forwarded-Proto $scheme;
#   }

location /api/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
