<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Triangles &middot; Evan Leckliter</title>
  <meta name="description" content="Triangles — the classic dots-and-triangles pencil game. Play vs the computer or a friend." />
  <style>
    :root {
      --bg: #0f1116;
      --fg: #e6e6e6;
      --muted: #9aa0aa;
      --line: #2a2f3a;
      --p0: #6ca0ff;   /* You */
      --p1: #ff7a59;   /* CPU / Player 2 */
      --accent: #6ca0ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--fg);
      padding: 1.5rem 1rem 3rem;
    }
    h1 { font-size: 2rem; margin: 0 0 .25rem; }
    .sub { color: var(--muted); margin: 0 0 1.25rem; text-align: center; max-width: 34rem; }
    .controls { display: flex; flex-wrap: wrap; gap: .5rem; justify-content: center; margin-bottom: 1rem; }
    .controls label { color: var(--muted); font-size: .9rem; align-self: center; }
    select, button {
      font: inherit; color: var(--fg); background: #171b24;
      border: 1px solid var(--line); border-radius: 8px; padding: .45rem .8rem; cursor: pointer;
    }
    button.primary { background: var(--accent); color: #0b0d12; border-color: var(--accent); font-weight: 600; }
    button:hover { border-color: var(--accent); }
    .scoreboard { display: flex; gap: 1rem; margin-bottom: .75rem; }
    .score { padding: .5rem 1rem; border-radius: 10px; border: 2px solid transparent; min-width: 7rem; text-align: center; background: #171b24; }
    .score.p0 { color: var(--p0); }
    .score.p1 { color: var(--p1); }
    .score.active { border-color: currentColor; box-shadow: 0 0 0 3px rgba(108,160,255,.12); }
    .score .num { font-size: 1.6rem; font-weight: 700; line-height: 1; }
    .score .name { font-size: .8rem; color: var(--muted); }
    #status { margin: .25rem 0 1rem; min-height: 1.4rem; font-weight: 600; }
    canvas { touch-action: none; max-width: 100%; height: auto; background: #10131a; border-radius: 12px; border: 1px solid var(--line); }
    a.back { color: var(--muted); text-decoration: none; margin-top: 1.5rem; font-size: .9rem; }
    a.back:hover { color: var(--accent); text-decoration: underline; }
  </style>
</head>
<body>
  <h1>Triangles</h1>
  <p class="sub">Take turns drawing a line between two neighboring dots. Complete a triangle to score a point &mdash; and take another turn. Most triangles when the board fills up wins.</p>

  <div class="controls">
    <label for="mode">Mode</label>
    <select id="mode">
      <option value="cpu">Vs Computer</option>
      <option value="2p">2 Players</option>
    </select>
    <label for="size">Size</label>
    <select id="size">
      <option value="3">Small</option>
      <option value="4" selected>Medium</option>
      <option value="5">Large</option>
    </select>
    <button id="newgame" class="primary">New Game</button>
  </div>

  <div class="scoreboard">
    <div class="score p0" id="s0"><div class="num">0</div><div class="name">You</div></div>
    <div class="score p1" id="s1"><div class="num">0</div><div class="name">Computer</div></div>
  </div>

  <div id="status">Your turn</div>

  <canvas id="board" width="480" height="440"></canvas>

  <a class="back" href="/">&larr; Back to home</a>

  <script>
  (function () {
    const canvas = document.getElementById('board');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');
    const s0 = document.getElementById('s0'), s1 = document.getElementById('s1');
    const modeSel = document.getElementById('mode');
    const sizeSel = document.getElementById('size');

    const COL = ['#6ca0ff', '#ff7a59'];   // player colors
    const MARGIN = 44;
    const TARGET_W = 480;

    let N, s, h, originX, originY;
    let edges, triangles;
    let current, scores, mode, busy, hoverEdge;

    // ---- geometry helpers ----
    function dotXY(r, j) {
      return { x: originX + (j - r / 2) * s, y: originY + r * h };
    }
    function edgeDots(id) {
      const p = id.split(':'), t = p[0], r = +p[1], j = +p[2];
      if (t === 'L') return [[r, j], [r + 1, j]];
      if (t === 'R') return [[r, j], [r + 1, j + 1]];
      return [[r, j], [r, j + 1]]; // 'B'
    }

    // ---- build the board for N rows of small triangles ----
    function buildBoard(n) {
      N = n;
      s = (TARGET_W - 2 * MARGIN) / N;
      h = s * Math.sqrt(3) / 2;
      originX = TARGET_W / 2;
      originY = MARGIN;
      canvas.width = TARGET_W;
      canvas.height = Math.round(N * h + 2 * MARGIN);

      edges = {};
      triangles = [];
      for (let r = 0; r < N; r++) {
        for (let j = 0; j <= r; j++) {
          edges['L:' + r + ':' + j] = { drawn: false };
          edges['R:' + r + ':' + j] = { drawn: false };
        }
      }
      for (let r = 1; r <= N; r++) {
        for (let j = 0; j < r; j++) edges['B:' + r + ':' + j] = { drawn: false };
      }
      // upward triangles
      for (let r = 0; r < N; r++) {
        for (let j = 0; j <= r; j++) {
          triangles.push({
            owner: null,
            edges: ['L:' + r + ':' + j, 'R:' + r + ':' + j, 'B:' + (r + 1) + ':' + j],
            verts: [[r, j], [r + 1, j], [r + 1, j + 1]]
          });
        }
      }
      // downward triangles
      for (let r = 1; r < N; r++) {
        for (let j = 0; j < r; j++) {
          triangles.push({
            owner: null,
            edges: ['B:' + r + ':' + j, 'L:' + r + ':' + (j + 1), 'R:' + r + ':' + j],
            verts: [[r, j], [r, j + 1], [r + 1, j + 1]]
          });
        }
      }
    }

    // ---- rendering ----
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // claimed triangles
      for (const t of triangles) {
        if (t.owner === null) continue;
        const pts = t.verts.map(v => dotXY(v[0], v[1]));
        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y);
        ctx.lineTo(pts[1].x, pts[1].y);
        ctx.lineTo(pts[2].x, pts[2].y);
        ctx.closePath();
        ctx.fillStyle = t.owner === 0 ? 'rgba(108,160,255,.28)' : 'rgba(255,122,89,.28)';
        ctx.fill();
      }

      // edges
      for (const id in edges) {
        const [a, b] = edgeDots(id);
        const pa = dotXY(a[0], a[1]), pb = dotXY(b[0], b[1]);
        ctx.beginPath();
        ctx.moveTo(pa.x, pa.y);
        ctx.lineTo(pb.x, pb.y);
        if (edges[id].drawn) {
          ctx.strokeStyle = '#e6e6e6';
          ctx.lineWidth = 4;
        } else if (id === hoverEdge) {
          ctx.strokeStyle = COL[current];
          ctx.lineWidth = 4;
        } else {
          ctx.strokeStyle = '#2a2f3a';
          ctx.lineWidth = 2;
        }
        ctx.lineCap = 'round';
        ctx.stroke();
      }

      // dots
      for (let r = 0; r <= N; r++) {
        for (let j = 0; j <= r; j++) {
          const p = dotXY(r, j);
          ctx.beginPath();
          ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
          ctx.fillStyle = '#c3c9d4';
          ctx.fill();
        }
      }
    }

    // ---- hit testing ----
    function distToSeg(px, py, ax, ay, bx, by) {
      const dx = bx - ax, dy = by - ay;
      const len2 = dx * dx + dy * dy || 1;
      let t = ((px - ax) * dx + (py - ay) * dy) / len2;
      t = Math.max(0, Math.min(1, t));
      const cx = ax + t * dx, cy = ay + t * dy;
      return Math.hypot(px - cx, py - cy);
    }
    function edgeAt(px, py) {
      let best = null, bestD = 14;
      for (const id in edges) {
        if (edges[id].drawn) continue;
        const [a, b] = edgeDots(id);
        const pa = dotXY(a[0], a[1]), pb = dotXY(b[0], b[1]);
        const d = distToSeg(px, py, pa.x, pa.y, pb.x, pb.y);
        if (d < bestD) { bestD = d; best = id; }
      }
      return best;
    }
    function canvasCoords(evt) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (evt.clientX - rect.left) * (canvas.width / rect.width),
        y: (evt.clientY - rect.top) * (canvas.height / rect.height)
      };
    }

    // ---- game logic ----
    function humanTurn() { return mode === '2p' || current === 0; }

    function applyMove(id) {
      if (!edges[id] || edges[id].drawn) return;
      edges[id].drawn = true;
      let completed = 0;
      for (const t of triangles) {
        if (t.owner === null && t.edges.indexOf(id) !== -1 && t.edges.every(e => edges[e].drawn)) {
          t.owner = current;
          scores[current]++;
          completed++;
        }
      }
      hoverEdge = null;
      draw();
      updateScores();

      if (triangles.every(t => t.owner !== null)) { endGame(); return; }
      if (completed === 0) current = 1 - current;
      updateStatus();

      if (mode === 'cpu' && current === 1) { busy = true; setTimeout(aiStep, 480); }
      else busy = false;
    }

    // AI: take a free triangle; else play a "safe" edge; else random
    function aiStep() {
      const open = Object.keys(edges).filter(id => !edges[id].drawn);
      if (!open.length) return;
      let pick = open.find(id => completesSome(id));
      if (!pick) {
        const safe = open.filter(id => !createsPairFor(id));
        pick = safe.length ? safe[(Math.random() * safe.length) | 0]
                           : open[(Math.random() * open.length) | 0];
      }
      applyMove(pick);
    }
    function completesSome(id) {
      return triangles.some(t => t.owner === null && t.edges.indexOf(id) !== -1 &&
        t.edges.filter(e => edges[e].drawn).length === 2);
    }
    function createsPairFor(id) { // would hand the opponent a completion
      return triangles.some(t => t.owner === null && t.edges.indexOf(id) !== -1 &&
        t.edges.filter(e => edges[e].drawn).length === 1);
    }

    // ---- UI updates ----
    function updateScores() {
      s0.querySelector('.num').textContent = scores[0];
      s1.querySelector('.num').textContent = scores[1];
      s0.classList.toggle('active', current === 0);
      s1.classList.toggle('active', current === 1);
    }
    function names() {
      return mode === 'cpu' ? ['You', 'Computer'] : ['Player 1', 'Player 2'];
    }
    function updateStatus() {
      const nm = names();
      statusEl.textContent = (mode === 'cpu' && current === 0) ? 'Your turn'
        : (mode === 'cpu' && current === 1) ? "Computer's turn…"
        : nm[current] + "'s turn";
      statusEl.style.color = COL[current];
    }
    function endGame() {
      const nm = names();
      s0.classList.remove('active'); s1.classList.remove('active');
      let msg;
      if (scores[0] === scores[1]) msg = "It's a tie! " + scores[0] + '–' + scores[1];
      else {
        const w = scores[0] > scores[1] ? 0 : 1;
        msg = nm[w] + ' win' + (nm[w] === 'You' ? '' : 's') + '! ' +
              Math.max(scores[0], scores[1]) + '–' + Math.min(scores[0], scores[1]);
      }
      statusEl.textContent = '🏆 ' + msg;
      statusEl.style.color = 'var(--fg)';
      busy = false;
    }

    function newGame() {
      mode = modeSel.value;
      buildBoard(+sizeSel.value);
      current = 0; scores = [0, 0]; busy = false; hoverEdge = null;
      s1.querySelector('.name').textContent = mode === 'cpu' ? 'Computer' : 'Player 2';
      s0.querySelector('.name').textContent = mode === 'cpu' ? 'You' : 'Player 1';
      draw(); updateScores(); updateStatus();
    }

    // ---- events ----
    canvas.addEventListener('pointerdown', function (e) {
      if (busy || !humanTurn()) return;
      const c = canvasCoords(e);
      const id = edgeAt(c.x, c.y);
      if (id) applyMove(id);
    });
    canvas.addEventListener('pointermove', function (e) {
      if (e.pointerType === 'touch' || busy || !humanTurn()) return;
      const c = canvasCoords(e);
      const id = edgeAt(c.x, c.y);
      if (id !== hoverEdge) { hoverEdge = id; draw(); }
    });
    canvas.addEventListener('pointerleave', function () {
      if (hoverEdge) { hoverEdge = null; draw(); }
    });
    document.getElementById('newgame').addEventListener('click', newGame);
    modeSel.addEventListener('change', newGame);
    sizeSel.addEventListener('change', newGame);

    newGame();
  })();
  </script>
</body>
</html>
